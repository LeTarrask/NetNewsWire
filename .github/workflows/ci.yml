name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linting doesn't need a Mac, and macOS runners are scarce: run it on Linux
  # so it never waits in the macOS queue.
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    env:
      SWIFTLINT_VERSION: 0.62.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SwiftLint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          chmod +x "$RUNNER_TEMP/swiftlint/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  atshare-tests:
    name: ATShare Package Tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Run ATShare tests
        run: swift test --package-path Modules/ATShare

  macos-tests:
    name: macOS Tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Generate Secrets Sources
        run: PROJECT_DIR="$GITHUB_WORKSPACE" ./buildscripts/updateSecrets.sh

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Run macOS Test Plan
        shell: bash
        run: |
          set -euo pipefail

          result_bundle="${RUNNER_TEMP}/NetNewsWire-macOS.xcresult"
          build_log="${RUNNER_TEMP}/NetNewsWire-macOS-build.log"
          rm -rf "$result_bundle"

          set -o pipefail
          xcodebuild \
            -project NetNewsWire.xcodeproj \
            -scheme NetNewsWire \
            -testPlan NetNewsWire-CI \
            -xcconfig .github/macos-ci-no-signing.xcconfig \
            -destination "platform=macOS,arch=arm64" \
            -resultBundlePath "$result_bundle" \
            test 2>&1 | tee "$build_log" | xcbeautify --renderer github-actions

          ./buildscripts/fail_on_warnings.sh "$build_log"

      - name: Upload macOS Result Bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: netnewswire-macos-xcresult
          path: ${{ runner.temp }}/NetNewsWire-macOS.xcresult
          if-no-files-found: warn
          retention-days: 7

  ios-simulator-tests:
    name: iOS Simulator Tests
    # Start after the macOS tests so at most two macOS jobs queue at once.
    # With three in parallel, GitHub has been dropping one for lack of
    # macOS arm64 capacity ("job was not acquired by Runner").
    needs: macos-tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Generate Secrets Sources
        run: PROJECT_DIR="$GITHUB_WORKSPACE" ./buildscripts/updateSecrets.sh

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Run iOS Test Plan
        shell: bash
        run: |
          set -euo pipefail

          result_bundle="${RUNNER_TEMP}/NetNewsWire-iOS.xcresult"
          build_log="${RUNNER_TEMP}/NetNewsWire-iOS-build.log"
          rm -rf "$result_bundle"

          set -o pipefail
          xcodebuild \
            -project NetNewsWire.xcodeproj \
            -scheme NetNewsWire-iOS \
            -testPlan NetNewsWire-iOS \
            -xcconfig .github/ios-ci-no-signing.xcconfig \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            OTHER_SWIFT_FLAGS='$(inherited) -DDEBUG -DSKIP_APP_GROUP_ACCESS' \
            -resultBundlePath "$result_bundle" \
            test 2>&1 | tee "$build_log" | xcbeautify --renderer github-actions

          ./buildscripts/fail_on_warnings.sh "$build_log"

      - name: Upload iOS Result Bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: netnewswire-ios-xcresult
          path: ${{ runner.temp }}/NetNewsWire-iOS.xcresult
          if-no-files-found: warn
          retention-days: 7
